name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: release gate (clean-clone tests, never-ship scan, documented counts)
        run: python scripts/release_check.py
      - name: gates never crash-block on garbage input
        run: echo "not json" | python gates/file_governance.py; test $? -eq 0
      - name: one governed tick on a fresh home
        run: |
          export HEARTBEAT_HOME="$RUNNER_TEMP/hb"
          HEARTBEAT_SERVICE_FILTER='^com\.example\.' ./heartbeat/tick.sh; rc=$?; test $rc -le 1   # 0 ok, 1 = a check was red; >1 = the tick failed to record
          python ledger/ledger.py verify
          test "$(wc -l < "$HEARTBEAT_HOME/ledger/rounds.jsonl" | tr -d ' ')" = "1"
